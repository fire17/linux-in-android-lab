# Builds PhoneInPhone (debug APK). If this project lives in a subdirectory of a repo, set
# PROJECT_DIR accordingly (GitHub only reads workflows from the repo-root .github/ — copy this
# file there and keep PROJECT_DIR pointing here).
name: build-phoneinphone

on:
  push:
    paths: ["android-in-android/**", ".github/workflows/android-in-android-build.yml"]
  workflow_dispatch:

env:
  PROJECT_DIR: android-in-android

jobs:
  assemble:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          # v6 defaults to the proprietary "enhanced" cache (free preview only for private repos);
          # basic = MIT wrapper over actions/cache, works the same on public and private repos.
          cache-provider: basic

      - name: Cache fetched binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_DIR }}/.fetch-cache
          key: pip-fetch-${{ hashFiles(format('{0}/scripts/fetch-*.sh', env.PROJECT_DIR)) }}

      - name: Tools for .deb extraction
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils xz-utils patchelf

      - name: Fetch pinned binaries (scrcpy-server, proot, Alpine rootfs) — sha256-verified
        run: bash scripts/fetch-all.sh

      - name: Unit tests (scrcpy protocol encoding)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Show APK contents (sanity)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'lib/|assets/' || true
          # Guard: the app opens rootfs/alpine-minirootfs-<arch>.rootfs.bin and gunzips it itself.
          # AGP gunzips *.gz assets during packaging, so a .tar.gz name would land as .tar (it did in
          # run 44518939858). Fail the build rather than ship an APK whose A2 rung can never pass.
          unzip -l "$APK" | grep -E 'assets/rootfs/alpine-minirootfs-aarch64\.rootfs\.bin'
          unzip -l "$APK" | grep -E 'assets/rootfs/alpine-minirootfs-x86_64\.rootfs\.bin'
          unzip -p "$APK" assets/rootfs/alpine-minirootfs-aarch64.rootfs.bin | head -c 2 | od -An -tx1 | grep -q '1f 8b'
          unzip -l "$APK" | grep -E 'assets/scrcpy-server\.jar'

      - uses: actions/upload-artifact@v7
        with:
          name: PhoneInPhone-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
