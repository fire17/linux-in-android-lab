# LinuxInApp CI — fetch pinned binaries, build the debug APK, upload it.
# NOTE: GitHub only runs workflows from the REPO ROOT's .github/workflows/. If this project is
# pushed as its own repo, this file works as-is. If it lives in a monorepo subfolder, copy it to the
# root and set APP_DIR below to the subfolder (e.g. ideas-1911-lab/apps/linux-in-app).
name: build

on:
  push:
    paths: ["linux-in-app/**", ".github/workflows/linux-in-app-build.yml"]
  workflow_dispatch:

env:
  APP_DIR: linux-in-app
  GRADLE_VERSION: "8.14.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 36 + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # v6 defaults to the proprietary "enhanced" cache (free only for public repos / preview for
          # private). "basic" is the MIT actions/cache path and works the same in any repo.
          cache-provider: basic

      - name: Fetch pinned binaries (proot jniLibs + Alpine minirootfs), sha256-verified
        run: bash scripts/fetch-all.sh

      - name: Show payload
        run: |
          find app/src/main/jniLibs app/src/main/assets -type f -exec ls -l {} \;

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Check native libs are packaged uncompressed-extractable
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "--- every asset packaged in the APK ---"
          unzip -l "$APK" | grep -E ' assets/' || echo "NO assets/ entries in APK"
          echo "---------------------------------------"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86_64)/lib(proot|proot_loader|talloc|android-shmem)\.so'
          unzip -l "$APK" | grep -E 'assets/rootfs/alpine-(aarch64|x86_64)\.rootfs\.bin'
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -i extractNativeLibs || true
          sha256sum "$APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LinuxInApp-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # Best-effort on-device proof: boots an x86_64 emulator and runs the same self-test as the
  # in-app button, ONE proot run per step (builtin echo, exec uname -m, fork probe, uname -a,
  # os-release, id). Non-blocking: the APK artifact above is the deliverable; this job tells us
  # whether proot actually runs inside a real Android app sandbox (zygote seccomp + untrusted_app
  # SELinux). x86_64 matters here because Android's app seccomp policy rejects fork(2) on x86_64 and
  # musl calls it there; proot >= 5.1.107.98 rewrites it to clone(2) (see README).
  emulator-selftest:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - run: bash scripts/fetch-all.sh

      - name: Run ProotSelfTest on emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: ${{ env.APP_DIR }}
          # NOTE: the runner executes each line as its own `sh -c`, so every line is self-contained.
          script: |
            adb logcat -c || true
            gradle --no-daemon connectedDebugAndroidTest > /tmp/selftest-gradle.log 2>&1; echo $? > /tmp/selftest-rc
            adb logcat -d -s LinuxInAppSelfTest:* > /tmp/selftest-logcat.txt 2>&1 || true
            adb logcat -d | grep -E 'LinuxInApp|libproot|proot|avc.*linuxinapp' | tail -200 > /tmp/selftest-context.txt 2>&1 || true
            adb shell getprop ro.product.cpu.abi > /tmp/selftest-abi.txt 2>&1 || true

      - name: Report self-test (each step + the exact failure line)
        if: always()
        run: |
          rc="$(cat /tmp/selftest-rc 2>/dev/null || echo missing)"
          echo "connectedDebugAndroidTest exit code: $rc"
          echo "emulator ABI: $(cat /tmp/selftest-abi.txt 2>/dev/null || echo '?')"
          echo "================ self-test steps (logcat LinuxInAppSelfTest) ================"
          grep -E 'device:|STEP |  [a-z0-9-]+\| |SUMMARY|libproot.so:|nativeLibraryDir|rootfs' /tmp/selftest-logcat.txt \
            | sed -E 's/^.*LinuxInAppSelfTest: //' || echo "(no LinuxInAppSelfTest lines - did the test even start?)"
          echo "================ failure lines ================"
          grep -hE "can't fork|Function not implemented|not implemented|Bad system call|SIGSYS|denied|No such file|cannot|can't" \
            /tmp/selftest-logcat.txt /tmp/selftest-context.txt | sed -E 's/^.*LinuxInAppSelfTest: //' | sort -u | head -40 || true
          # Annotations so the exact failing step + line show on the run page without opening logs.
          grep -E 'STEP .* exit=' /tmp/selftest-logcat.txt | grep -v ' exit=0 ' | sed -E 's/^.*LinuxInAppSelfTest: //' \
            | while read -r line; do echo "::error title=proot self-test (x86_64 emulator)::$line"; done || true
          {
            echo "### proot self-test on x86_64 emulator (API 34)"
            echo '```'
            grep -E 'STEP |SUMMARY' /tmp/selftest-logcat.txt | sed -E 's/^.*LinuxInAppSelfTest: //' || echo "no STEP lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "---------------- gradle tail ----------------"; tail -60 /tmp/selftest-gradle.log || true
            echo "---------------- logcat context ----------------"; cat /tmp/selftest-context.txt || true
            exit 1
          fi

  # arm64 is what real phones run, and hosted runners can't boot an arm64 Android emulator (no
  # Android SDK / emulator on the arm64 image, no nested KVM). Next best honest check: run the EXACT
  # arm64-v8a jniLibs + Alpine aarch64 rootfs, with ProotLauncher's flags/env, inside Termux's
  # Android-userland Docker image on a native arm64 runner. Proves the binaries, the loader, the
  # talloc soname patch and aarch64 musl fork-under-proot. Does NOT prove Android's app sandbox
  # (stock Linux kernel, no zygote seccomp, no SELinux) - see README.
  arm64-proot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch pinned binaries (same script as the APK job)
        run: bash scripts/fetch-all.sh

      - name: Run proot self-test steps (arm64-v8a jniLibs, Alpine aarch64) in termux-docker
        run: |
          set +e
          docker run --rm --privileged -v "$PWD:/work:ro" -e WORK_DIR=/work \
            termux/termux-docker:aarch64 bash /work/scripts/ci-arm64-proot.sh 2>&1 | tee /tmp/arm64.log
          rc=${PIPESTATUS[0]}
          {
            echo "### proot self-test, arm64 (termux-docker, NOT an Android app sandbox)"
            echo '```'; grep -E 'host uname -m|STEP |SUMMARY' /tmp/arm64.log || echo "no STEP lines"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'STEP .* exit=' /tmp/arm64.log | grep -v ' exit=0 ' \
            | while read -r line; do echo "::error title=proot self-test (arm64 termux-docker)::$line"; done || true
          exit $rc
