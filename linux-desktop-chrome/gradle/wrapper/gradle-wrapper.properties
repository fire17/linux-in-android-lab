# Gradle 8.14.3 meets AGP 8.13.x's minimum (8.13). The sha256 is the same pin the sibling project
# linux-in-app uses, from https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256.
# CI does not use the wrapper: gradle/actions/setup-gradle installs this exact version. Run
# `gradle wrapper --gradle-version 8.14.3` once if you want ./gradlew; the jar is not committed.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
