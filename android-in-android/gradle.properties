org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# scrcpy-server version. MUST match the jar that scripts/fetch-scrcpy-server.sh downloads:
# the server aborts unless the client passes its exact version string as argv[1].
pip.scrcpyVersion=5.0.1
